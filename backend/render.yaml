services:
  - type: web
    name: vincent-store-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
        # Set this in Render dashboard → Environment tab
      - key: JWT_SECRET
        sync: false
        # Set this in Render dashboard → Environment tab
